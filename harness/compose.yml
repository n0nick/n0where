name: n0where-harness

# Two PHP versions against one codebase and one database.
#   :8074 -> PHP 7.4 (reference: what prod runs today)
#   :8083 -> PHP 8.3 (target)
# Golden files are captured from 8074 and diffed against 8083.

services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: n0where
      MYSQL_DATABASE: n0db
      MYSQL_USER: n0db
      MYSQL_PASSWORD: n0db
    volumes:
      - ./seed:/docker-entrypoint-initdb.d:ro
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pn0where"]
      interval: 5s
      timeout: 5s
      retries: 30

  php74:
    build:
      context: .
      dockerfile: php74.Dockerfile
    volumes:
      - ..:/var/www/html/n0
      - tc74:/var/www/html/n0/templates_c
      - cache74:/var/www/html/n0/cache
    depends_on:
      db:
        condition: service_healthy

  php83:
    build:
      context: .
      dockerfile: php83.Dockerfile
    volumes:
      - ..:/var/www/html/n0
      - tc83:/var/www/html/n0/templates_c
      - cache83:/var/www/html/n0/cache
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:alpine
    ports:
      - "8074:8074"
      - "8083:8083"
    volumes:
      - ..:/var/www/html/n0:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php74
      - php83

volumes:
  dbdata:
  tc74:
  tc83:
  cache74:
  cache83:
