# Mirrors prod's /etc/nginx/sites-enabled/n0where.n0nick.net.
# Prod root is .../html with the app in a physical n0/ subdir, so the repo is
# mounted at /var/www/html/n0 and REQUEST_URI looks like /n0/post/123 --
# which is what index.php's array_shift($path) + switch($path[1]) expects.
# TLS, certbot and the apex redirect are prod-only and omitted.

# fastcgi_pass with a literal hostname is resolved ONCE at startup. When the
# php containers are recreated (any `up --build`) they can come back on
# different IPs, and nginx keeps routing to the stale ones -- silently serving
# 8.3 on the 7.4 port. Resolving through a variable forces per-request lookup
# against Docker's embedded DNS.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 8074;
    server_name localhost;

    root /var/www/html;
    index index.php index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }

    location /n0 {
        try_files $uri $uri/ /n0/index.php;
    }

    location = /__phpver {
        set $fpm_probe php74:9000;
        fastcgi_pass  $fpm_probe;
        fastcgi_param SCRIPT_FILENAME /usr/local/etc/probe.php;
        include       fastcgi_params;
    }

    error_page 404 /404.html;
    error_page 403 /404.html;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        set $fpm php74:9000;
        fastcgi_pass  $fpm;
        fastcgi_index index.php;
        include       fastcgi.conf;
    }
}

server {
    listen 8083;
    server_name localhost;

    root /var/www/html;
    index index.php index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }

    location /n0 {
