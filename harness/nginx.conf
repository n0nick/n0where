    }

    location = /__phpver {
        set $fpm_probe php83:9000;
        fastcgi_pass  $fpm_probe;
        fastcgi_param SCRIPT_FILENAME /usr/local/etc/probe.php;
        include       fastcgi_params;
    }

    error_page 404 /404.html;
    error_page 403 /404.html;

    location ~ \.php$ {
        try_files $uri =404;
