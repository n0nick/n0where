; display_errors=Off is deliberate and load-bearing, not cosmetic.
;
; With it On, PHP writes diagnostics into the response body, which does not
; merely add noise -- it changes behaviour: output starts before headers are
; sent, and a page emitting hundreds of notices (archive/2003/2 produced 14KB
; of them) gets truncated and renders nothing at all. Prod runs with it Off,
; so the harness must too, or it is measuring a different program.
;
; Diagnostics go to a log the capture script truncates per request instead,
; which keeps them per-URL and completely out of the compared output.
display_errors = Off
log_errors = On
error_log = /tmp/php-errors.log
error_reporting = E_ALL

; The official php Docker images ship no php.ini at all, so the compiled-in
; default short_open_tag=On applies -- while Ubuntu/sury set it Off. That gap
; hid a real parse error in gah/side.php that production has had for years.
; Match production.
short_open_tag = Off
